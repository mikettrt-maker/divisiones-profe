const AudioEngine = {
ctx: null,
init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
playTone(freq, dur, type='square', vol=0.1) {
this.init();
const o = this.ctx.createOscillator(), g = this.ctx.createGain();
o.type = type; o.frequency.value = freq; g.gain.value = vol;
o.connect(g); g.connect(this.ctx.destination); o.start();
setTimeout(() => o.stop(), dur);
},
playClick()   { this.playTone(800,50,'square',0.05); },

function showToast(msg, type='success', duration=4000) {
const c = document.getElementById('toast-container');
const t = document.createElement('div');
t.className = `toast ${type}`;
t.innerHTML = msg;
c.appendChild(t);
setTimeout(() => { if(t.parentNode) t.parentNode.removeChild(t); }, duration);
}
function updateCoinDisplay(){ document.getElementById('coinDisplay').innerText = currentCoins; }
function updateInventoryUI(){
const container = document.getElementById('inventory-container');
container.innerHTML = '';
Object.entries(inventory).forEach(([key, count]) => {
if(count > 0) {
const weapon = WEAPONS[key];
const div = document.createElement('div');
div.className = 'inv-item';
div.title = `${weapon.name}: ${weapon.damage} pts (-${weapon.shieldDmg} escudo)`;
div.innerHTML = `<span>${weapon.icon}</span><span>${count}</span>`;
container.appendChild(div);
}
});

container.appendChild(shieldDiv);

function incrementStreak() {

if(bonus) { currentCoins += bonus; updateCoinDisplay(); showStreakBonus(currentStreak, bonus); AudioEngine.playStreak(); }

function resetStreak() { currentStreak = 0; updateStreakUI(); }
function updateStreakUI() {
const d = document.getElementById('streak-display'), c = document.getElementById('streak-count'), ic = document.getElementById('streak-icon');
c.innerText = currentStreak; d.classList.remove('active','on-fire');
if(currentStreak>=5) { d.classList.add('on-fire'); ic.innerText='🔥'; }
else if(currentStreak>=2) { d.classList.add('active'); ic.innerText='⚡'; }
else { ic.innerText='⚡'; }
}

document.body.appendChild(el);

}

    const allAvatars = [...AVATAR_STYLES_STANDARD, ...AVATAR_STYLES_EXCLUSIVE];
    const found = allAvatars.find(a => a.id === styleOrObj);
    if (found) return found.url + '?t=' + Date.now();
    const defaultAvatar = AVATAR_STYLES_STANDARD[0];
    if (defaultAvatar) return defaultAvatar.url + '?t=' + Date.now();
  }
  return 'https://oskrniownbbzkgnwunzz.supabase.co/storage/v1/object/public/avatares/1.png';
}

if(!currentUser) return;
const allAvatars = [...AVATAR_STYLES_STANDARD, ...AVATAR_STYLES_EXCLUSIVE];
const found = allAvatars.find(a => a.id === currentAvatarStyle);

const rankInfo = getRankInfo(totalScore);
document.getElementById('avatar-rank-badge').innerText = rankInfo.name.toUpperCase();
document.getElementById('avatar-rank-badge').style.background = rankInfo.css === 'rank-heroic' 
  ? 'linear-gradient(135deg, #ef4444, #7a0000)' 
  : 'linear-gradient(135deg, var(--cr-gold-dark), #b8860b)';
if(userSquadId && SQUADS[userSquadId]) {
  document.getElementById('squad-badge-overlay').innerHTML = SQUADS[userSquadId].svg;
  document.getElementById('squad-badge-overlay').style.display = 'flex';
} else {
  document.getElementById('squad-badge-overlay').style.display = 'none';
}
}
function openShop(){
document.getElementById('shop-modal').style.display='flex';
document.getElementById('shop-coins-val').innerText = currentCoins;
const container = document.getElementById('shop-items');
container.innerHTML = '';
Object.entries(WEAPONS).forEach(([key, weapon]) => {
const div = document.createElement('div');
div.className = 'shop-item orange';
div.innerHTML = `<span class="shop-item-icon">${weapon.icon}</span><div class="shop-item-name">${weapon.name}</div><div class="shop-item-desc">${weapon.desc} (-${weapon.damage} pts, -${weapon.shieldDmg} 🛡️)</div><div class="shop-item-price"><i class="fas fa-coins"></i> ${weapon.price}</div><div class="shop-qty-badge">x${inventory[key]}</div><button class="shop-buy-btn orange-btn" onclick="buyWeapon('${key}', ${weapon.price})">Adquirir</button>`;
container.appendChild(div);
});
const shieldDiv = document.createElement('div');
shieldDiv.className = 'shop-item';
shieldDiv.innerHTML = `<span class="shop-item-icon">🛡️</span><div class="shop-item-name">Protección del Consejo</div><div class="shop-item-desc">Resiste 5 ataques</div><div class="shop-item-price"><i class="fas fa-coins"></i> 300</div><button class="shop-buy-btn" onclick="buyShield(5, 300)">Adquirir</button>`;
container.appendChild(shieldDiv);
}
function closeShop(){ document.getElementById('shop-modal').style.display='none'; }
function buyWeapon(type, price) {
if(currentCoins < price) return showToast(`❌ Necesitas ${price} florines`,'tomato');
if(!confirm(`¿Adquirir ${WEAPONS[type].name} por ${price} florines?`)) return;
currentCoins -= price; inventory[type]++;
updateCoinDisplay(); updateInventoryUI(); openShop();
AudioEngine.playShop();
showToast(`✅ ${WEAPONS[type].icon} ${WEAPONS[type].name} añadido a tu arsenal!`,'success');
_supabase.from('profiles').update({ coins: currentCoins }).eq('id', currentUser.id)
  .then(res => { if(res.error) console.error("Error guardando monedas en compra", res.error); });
saveInventory();
}
async function buyShield(qty, price) {
if(currentCoins < price) return showToast(`❌ Necesitas ${price} florines`,'tomato');
if(!confirm(`¿Comprar Protección del Consejo (${qty} usos) por ${price} florines?`)) return;
try {
currentCoins -= price;
shieldDurability += qty;
const { error } = await _supabase.from('profiles').update({coins: currentCoins, shield_durability: shieldDurability}).eq('id', currentUser.id);
if (error) throw error;
updateCoinDisplay(); updateInventoryUI(); openShop();
AudioEngine.playShop();
showToast(`✅ 🛡️ Protección adquirida! Tienes ${shieldDurability} usos`,'success');
} catch(e) {
currentCoins += price; shieldDurability -= qty;
showToast(`❌ Error: ${e.message}`,'tomato');
}
}
async function attackUser(targetId, targetName, weaponType) {
const weapon = WEAPONS[weaponType];
if(!weapon) return;
if(inventory[weaponType] <= 0) return showToast("¡No tienes esta arma!",'tomato');
if(!confirm(`¿Usar ${weapon.icon} ${weapon.name} contra ${targetName}? (-${weapon.damage} pts, -${weapon.shieldDmg} 🛡️)`)) return;
inventory[weaponType]--; totalAttacks++; updateInventoryUI();
try {
const { data: victim, error: fetchError } = await _supabase.from('profiles').select('total_score, shield_durability, squad_id').eq('id', targetId).single();
if(fetchError || !victim) throw new Error("Aspirante no encontrado");
let updates = {}; let msg = '';
let victimShield = victim.shield_durability || 0;
if(victimShield > 0) {
victimShield = Math.max(0, victimShield - weapon.shieldDmg);
updates.shield_durability = victimShield;
msg = `🛡️ ¡${targetName} tenía PROTECCIÓN! Tu ${weapon.icon} le quitó ${weapon.shieldDmg} puntos de escudo.`;
if(victimShield === 0) msg += " ¡Escudo destruido!";
} else {
const newScore = Math.max(0, (victim.total_score || 0) - weapon.damage);
updates.total_score = newScore;
msg = `${weapon.icon} ¡Atacaste a ${targetName} con ${weapon.name}! Perdió ${weapon.damage} puntos.`;
}
const { error: updateError } = await _supabase.from('profiles').update(updates).eq('id', targetId);
if(updateError) throw updateError;
await _supabase.from('profiles').update({[`inventory_${weaponType}`]: inventory[weaponType], total_attacks: totalAttacks}).eq('id', currentUser.id);
showToast(msg, 'tomato');
setTimeout(async () => { await updateRanking(); }, 600);
} catch(e) {
console.error('Error en ataque:', e);
showToast("❌ Error: "+e.message, 'tomato');
inventory[weaponType]++; updateInventoryUI();
}
}
function saveInventory(){
if(!currentUser) return;
_supabase.from('profiles').update({
inventory_dagger: inventory.dagger, inventory_sword: inventory.sword,
inventory_bow: inventory.bow, inventory_axe: inventory.axe, inventory_hammer: inventory.hammer,
shield_durability: shieldDurability, total_attacks: totalAttacks
}).eq('id', currentUser.id).then(res => { if(res.error) console.error("Error guardando inventario", res.error); });
}
let rankInt;
function startRanking(){ updateRanking(); rankInt = setInterval(updateRanking, 5000); }
let rankingDataCache = [];

/* ====================== RANKING (CORREGIDO) ====================== */
async function updateRanking(){
const list = document.getElementById('ranking-list');
try {
const { data, error } = await _supabase.from('profiles')
  .select('id,username,total_score,avatar_style,completed_at,is_banned,squad_id,shield_durability')
  .is('completed_at', null)
  .eq('is_banned', false)
  .order('total_score',{ascending:false});
if(error) throw error;
if(!data||!data.length){ list.innerHTML='<li style="text-align:center;padding:10px;color:#666;">La corte está vacía.</li>'; return; }

if (list.children.length !== data.length) {
  rankingDataCache = data;
  renderFullRanking(data);
  // IMPORTANTE: no hacemos return, para que se actualicen también las escuadras y misiones
} else {
  const existingItems = list.querySelectorAll('.ranking-item');
  data.forEach((u, i) => {
    const old = rankingDataCache[i];
    if (!old || old.id !== u.id) {
      rankingDataCache = data;
      renderFullRanking(data);
      return; // salimos del forEach (no de la función)
    }
    const item = existingItems[i];
    if (!item) return;
    const posSpan = item.querySelector('.rank-pos');
    if (posSpan) posSpan.textContent = (i+1) + '.';
    const scoreSpan = item.querySelector('.rank-score');
    if (scoreSpan && (u.total_score||0) !== (old.total_score||0)) {
      scoreSpan.textContent = u.total_score||0;
    }
    const rI = getRankInfo(u.total_score||0);
    const rankName = item.querySelector('.rank-name-list');
    if (rankName) rankName.textContent = u.username;
    const tierSpan = item.querySelector('.rank-tier-list');
    if (tierSpan) tierSpan.textContent = `${rI.icon} ${rI.name} ${rI.tier}`;
    const avatarImg = item.querySelector('.list-avatar');
    const newAvatarUrl = getAvatarUrl(u.username||'guest', u.avatar_style||'avatar1');
    if (avatarImg && avatarImg.src !== newAvatarUrl) {
      avatarImg.src = newAvatarUrl;
    }
    const shieldContainer = item.querySelector('.shield-bar-container');
    if (shieldContainer) {
      const sh = u.shield_durability || 0;
      const maxSh = 5, pct = Math.min(100, (sh / maxSh) * 100);
      const fill = shieldContainer.querySelector('.shield-bar-fill');
      if (fill) fill.style.width = pct + '%';
      const text = shieldContainer.querySelector('.shield-text');
      if (text) text.textContent = `${sh}/${maxSh}`;
    }
  });
  rankingDataCache = data;
}

// ** SIEMPRE ACTUALIZAMOS ESCUADRAS Y MISIONES **
updateSquadRanking(data);
loadActiveMissions(data);
} catch(err){ list.innerHTML='<li style="text-align:center;padding:10px;color:red;">Error.</li>'; }
}

function renderFullRanking(data) {
  const list = document.getElementById('ranking-list');
  const me = currentUser?.email?.split('@')[0];
  list.innerHTML = data.map((u,i)=>{
    const s = u.total_score||0, rI = getRankInfo(s);
    const isMe = (me && u.username===me);
    let rc = "ranking-item "+rI.css, dn = u.username||'Yo';
    if(i===0){ rc+=" rank-1"; dn+=" 👑"; } else if(i<10) rc+=" elite";
    if(isMe) rc+=" me";
    const avUrl = getAvatarUrl(u.username||'guest', u.avatar_style||'adventurer');
    const sq = u.squad_id&&SQUADS[u.squad_id] ? `<div style="width:16px;height:18px;">${SQUADS[u.squad_id].svg}</div>` : '';
    let atkButtons = '';
    if(!isMe) {
      Object.entries(inventory).forEach(([key, count]) => {
        if(count > 0) { const w = WEAPONS[key]; atkButtons += `<button class="attack-btn" onclick="attackUser('${u.id}','${u.username}','${key}')" title="${w.name} (-${w.damage})">${w.icon}</button> `; }
      });
    }
    let shieldHTML = '';
    const sh = u.shield_durability || 0;
    if(sh > 0) {
      const maxSh = 5, pct = Math.min(100, (sh / maxSh) * 100);
      let gradient = 'linear-gradient(90deg, #00e676, #00c853)';
      let glowColor = 'rgba(0,230,118,0.5)';
      if(pct <= 30) { 
        gradient = 'linear-gradient(90deg, #ff1744, #d50000)';
        glowColor = 'rgba(255,23,68,0.6)';
      } else if(pct <= 60) { 
        gradient = 'linear-gradient(90deg, #ffcc00, #ff9800)';
        glowColor = 'rgba(255,204,0,0.5)';
      }
      shieldHTML = `<div class="shield-bar-container"><span class="shield-icon">🛡️</span><div class="shield-bar-bg"><div class="shield-bar-fill" style="width:${pct}%;background:${gradient};box-shadow:0 0 8px ${glowColor};"></div></div><span class="shield-text">${sh}/${maxSh}</span></div>`;
    }
    return `<li class="${rc}" data-userid="${u.id}"><span class="rank-pos">${i+1}.</span><div class="rank-row"><img src="${avUrl}" class="list-avatar ${rI.avatar}"><div class="rank-info"><span class="rank-name-list">${dn}</span><span class="rank-tier-list">${rI.icon} ${rI.name} ${rI.tier}</span>${shieldHTML}</div>${sq}</div><span class="rank-score">${s}</span><div style="display:flex;gap:2px;">${atkButtons}</div></li>`;
  }).join('');
  rankingDataCache = data;
}

/* ====================== RESTO DEL CÓDIGO (sin cambios) ====================== */
function updateSquadRanking(all){
const list = document.getElementById('squad-list'), ss = {};
Object.keys(SQUADS).forEach(id=>ss[id]=0);
all.forEach(u=>{ if(u.squad_id&&SQUADS[u.squad_id]) ss[u.squad_id] += (u.total_score||0); });
list.innerHTML = Object.entries(ss).sort((a,b)=>b[1]-a[1]).map(([id,sc])=>{
const sq = SQUADS[id];
return `<li class="squad-rank-item" style="border-left-color:${sq.color}"><div class="squad-rank-left"><div class="squad-shield-small">${sq.svg}</div><span style="font-weight:700;color:${sq.color};font-family:'Cinzel',serif;">${sq.name}</span></div><span class="squad-score">${sc} pts</span></li>`;
}).join('');
}
async function loadActiveMissions(allData){
if(!userSquadId) { document.getElementById('squad-missions-panel').style.display='none'; return; }
document.getElementById('squad-missions-panel').style.display = 'block';
const { data: missions } = await _supabase.from('squad_missions').select('*').eq('is_active', true);
if(!missions || missions.length === 0) { document.getElementById('missions-body').innerHTML = '<p style="text-align:center;color:#666;font-family:\'Cinzel\',serif;">No hay decretos activos.</p>'; return; }
const squadMembers = allData.filter(u => u.squad_id == userSquadId);
let squadPoints = squadMembers.reduce((sum, u) => sum + (u.total_score||0), 0);
let squadAttacks = squadMembers.reduce((sum, u) => sum + (u.total_attacks||0), 0);
let maxLevel = Math.max(...squadMembers.map(u => u.current_level||1), 0);
const body = document.getElementById('missions-body');
body.innerHTML = missions.map(m => {
let currentVal = 0;
if(m.type === 'points') currentVal = squadPoints;
else if(m.type === 'attacks') currentVal = squadAttacks;
else if(m.type === 'level') currentVal = maxLevel;
const pct = Math.min(100, Math.round((currentVal / m.goal) * 100));
const done = pct >= 100;
return `<div class="mission-item ${done?'mission-complete':''}"><div class="mission-header"><span class="mission-name">${m.name}</span><span class="mission-reward">+${m.reward} 💰</span></div><div class="mission-bar-wrap"><div class="mission-bar" style="width:${pct}%"></div></div><div class="mission-progress-text">${done ? '✅ ¡Completada!' : `${Math.min(currentVal, m.goal)}/${m.goal}`}</div></div>`;
}).join('');
}
