<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reto de División - V25 (Arsenal Medieval)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;700;900&family=MedievalSharp&family=Rajdhani:wght@500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #0d0d0d;
      --bg-card: #1a1a1a;
      --golden: #c9a84c;
      --golden-light: #e0c878;
      --golden-dark: #a08030;
      --silver: #a0a0a0;
      --bronze: #b08050;
      --blue-magic: #4a90d9;
      --purple-magic: #8b5cf6;
      --red-life: #c0392b;
      --green-heal: #27ae60;
      --text-light: #f0e6d2;
      --text-dim: #a09080;
      --border-medieval: #4a3820;
      --button-bg: #2a1f0f;
      --button-hover: #3a2f1f;
      --rank-iron: #6b6b6b;
      --rank-bronze: #b08050;
      --rank-silver: #c0c0c0;
      --rank-gold: #ffd700;
      --rank-platinum: #e5e4e2;
      --rank-diamond: #b9f2ff;
      --rank-heroic: #ff6b35;
      --font-cinzel-decorative: 'Cinzel Decorative', serif;
      --font-cinzel: 'Cinzel', serif;
      --font-medieval: 'MedievalSharp', serif;
      --font-display: 'Rajdhani', sans-serif;
      --font-tech: 'Teko', sans-serif;
      --cell-size: clamp(28px, 9dvw, 40px);
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="none" width="100" height="100"/><path d="M0 0 L100 0 L100 100 L0 100 Z" fill="none" stroke="rgba(201,168,76,0.05)" stroke-width="0.5"/></svg>');
      font-family: var(--font-display);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .main-container {
      width: 100%;
      max-width: 800px;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 15px 10px 5px;
      position: relative;
    }

    .header h1 {
      font-family: var(--font-cinzel-decorative);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      background: linear-gradient(180deg, #f0d878 0%, #c9a84c 40%, #8b6914 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .header .subtitle {
      font-family: var(--font-cinzel);
      font-size: clamp(0.7rem, 2.5vw, 0.9rem);
      color: var(--golden);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-medieval);
      border-radius: 12px;
      padding: clamp(10px, 3vw, 18px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--golden-dark), var(--golden), var(--golden-dark), transparent);
      opacity: 0.6;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 55px;
    }

    .stat-icon {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      margin-bottom: 2px;
    }

    .stat-value {
      font-family: var(--font-tech);
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      font-weight: 700;
      color: var(--golden-light);
    }

    .stat-label {
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Division Area */
    .division-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .division-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      font-family: var(--font-tech);
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      color: var(--text-dim);
      width: 100%;
    }

    .division-info span {
      color: var(--golden-light);
      font-weight: 600;
    }

    .grid-container {
      position: relative;
      width: 100%;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
      padding: 5px 0;
      -webkit-user-select: none;
      user-select: none;
    }

    .grid-scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .residuo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .residuo-label {
      font-family: var(--font-cinzel);
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      color: var(--golden);
      min-width: auto;
      text-align: right;
      letter-spacing: 1px;
    }

    .residuo-input {
      width: clamp(60px, 18vw, 80px);
      height: var(--cell-size);
      background: #1a1a0a;
      border: 2px solid var(--border-medieval);
      color: var(--golden-light);
      text-align: center;
      font-family: var(--font-tech);
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      font-weight: 600;
      border-radius: 6px;
      touch-action: manipulation;
      -webkit-user-select: text;
      user-select: text;
      -webkit-appearance: none;
    }

    .grid-matriz {
      display: grid;
      grid-template-columns: repeat(9, var(--cell-size));
      grid-template-rows: repeat(15, var(--cell-size));
      gap: 1px;
      width: fit-content;
      margin: 0 auto;
      background: #1a1a1a;
      border: 2px solid var(--border-medieval);
      border-radius: 4px;
      padding: 2px;
      -webkit-user-select: none;
      user-select: none;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-tech);
      font-size: clamp(0.8rem, 4dvw, 1.2rem);
      font-weight: 600;
      color: #ccc;
      cursor: default;
      border-radius: 2px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    .cell.cociente {
      color: var(--golden-light);
      cursor: pointer;
      background: #111108;
      font-weight: 700;
      touch-action: manipulation;
    }

    .cell.cociente:active {
      background: #2a2a10;
      transform: scale(0.95);
      transition: transform 0.1s;
    }

    .cell.resta {
      color: #aaa;
      font-size: clamp(0.6rem, 3dvw, 0.8rem);
      background: #0c0c0c;
      cursor: default;
      touch-action: manipulation;
    }

    .cell.producto {
      color: #8b8;
      background: #0c0c0c;
      cursor: default;
      touch-action: manipulation;
    }

    .cell.highlight {
      animation: cellPulse 0.6s ease-in-out;
      border: 1px solid var(--golden-light);
    }

    @keyframes cellPulse {
      0%, 100% { background: #0a0a0a; }
      50% { background: #2a2a10; }
    }

    .cell.selected {
      border: 2px solid var(--golden);
      box-shadow: 0 0 8px rgba(201,168,76,0.5);
    }

    .cell.error {
      color: #e74c3c;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .cell.disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
    }

    /* Number Pad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(4px, 1.5vw, 8px);
      max-width: 350px;
      margin: 0 auto;
      width: 100%;
    }

    .numpad-btn {
      aspect-ratio: 1;
      min-width: 0;
      min-height: 44px;
      background: var(--button-bg);
      border: 2px solid var(--border-medieval);
      color: var(--golden-light);
      font-family: var(--font-tech);
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    .numpad-btn:active {
      background: var(--golden-dark);
      transform: scale(0.93);
      transition: transform 0.1s;
      border-color: var(--golden);
    }

    .numpad-btn.action {
      background: #1a0f20;
      border-color: var(--purple-magic);
      color: #b090d0;
      font-size: clamp(0.7rem, 2.5vw, 0.9rem);
    }

    .numpad-btn.action:active {
      background: #2a1040;
      transform: scale(0.93);
      transition: transform 0.1s;
    }

    .numpad-btn.danger {
      background: #1a0a0a;
      border-color: var(--red-life);
      color: #e08080;
    }

    .numpad-btn.danger:active {
      background: #2a1010;
      transform: scale(0.93);
      transition: transform 0.1s;
    }

    /* Buttons */
    .btn {
      background: var(--button-bg);
      border: 2px solid var(--border-medieval);
      color: var(--golden-light);
      font-family: var(--font-cinzel);
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      text-transform: uppercase;
      min-height: 44px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.95);
      transition: transform 0.1s;
      background: var(--golden-dark);
      border-color: var(--golden);
    }

    .btn.primary {
      background: linear-gradient(180deg, #3a2a10, #2a1a08);
      border-color: var(--golden);
      color: var(--golden-light);
    }

    .btn.danger {
      background: #1a0a0a;
      border-color: var(--red-life);
      color: #e08080;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    /* Messages */
    .message-area {
      text-align: center;
      font-family: var(--font-medieval);
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      min-height: 30px;
      color: var(--golden-light);
      padding: 5px;
    }

    .message-area.error {
      color: #e08080;
    }

    .message-area.success {
      color: #80e080;
    }

    /* Ranking */
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(0.7rem, 2vw, 0.9rem);
    }

    .ranking-table th {
      font-family: var(--font-cinzel);
      color: var(--golden);
      padding: 8px 4px;
      border-bottom: 1px solid var(--border-medieval);
      font-size: clamp(0.6rem, 2vw, 0.8rem);
      letter-spacing: 1px;
    }

    .ranking-table td {
      padding: 6px 4px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .rank-badge {
      font-family: var(--font-cinzel);
      font-weight: 700;
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal {
      background: var(--bg-card);
      border: 2px solid var(--border-medieval);
      border-radius: 16px;
      padding: clamp(15px, 4vw, 25px);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal h2 {
      font-family: var(--font-cinzel-decorative);
      color: var(--golden);
      margin-bottom: 15px;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
    }

    .modal input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0a0a0a;
      border: 1px solid var(--border-medieval);
      color: var(--text-light);
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 3vw, 1rem);
      border-radius: 6px;
      min-height: 44px;
      touch-action: manipulation;
      -webkit-appearance: none;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab {
      padding: 8px 14px;
      background: var(--button-bg);
      border: 1px solid var(--border-medieval);
      color: var(--text-dim);
      font-family: var(--font-cinzel);
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      min-height: 40px;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--golden);
      border-bottom-color: var(--bg-card);
    }

    .tab:active {
      background: var(--golden-dark);
      color: var(--golden-light);
      transition: background 0.1s;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-medieval);
      border-radius: 2px;
    }

    /* Utility */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-gold { color: var(--golden-light); }

    /* Login screen */
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 30px 15px;
    }
  </style>
</head>
<body>
  <div class="main-container" id="app">
    <!-- Header -->
    <div class="header">
      <h1>ARSENAL MEDIEVAL</h1>
      <div class="subtitle">Reto de División</div>
    </div>

    <!-- Dynamic content will be rendered here -->
    <div id="content"></div>
  </div>

  <script type="module">
    // ============ SUPABASE CONFIG ============
    const SUPABASE_URL = 'https://ibjbudfzsqagerzcbmih.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliamJ1ZGZ6c3FhZ2VyemNibWloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzMjY3NDgsImV4cCI6MjA1OTkwMjc0OH0.syPpN5BA3_N2eIR-H_a2xx-WCJsk7g05PkMJOUAKd8U';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const confetti = window.confetti;

    // ============ GAME STATE ============
    const state = {
      user: null,
      session: null,
      view: 'login', // 'login', 'game', 'ranking', 'profile'
      division: null,
      cociente: [],
      currentRow: 0,
      currentCol: 0,
      selectedCell: null,
      gameActive: false,
      score: 0,
      streak: 0,
      bestStreak: 0,
      errors: 0,
      totalProblems: 0,
      correctProblems: 0,
      currentProblemStartTime: null,
      problemTimes: [],
      difficulty: 'medium',
      rankingFilter: 'all'
    };

    // ============ DOM REFERENCE ============
    const content = document.getElementById('content');

    // ============ RENDER ENGINE ============
    function render() {
      switch(state.view) {
        case 'login': renderLogin(); break;
        case 'game': renderGame(); break;
        case 'ranking': renderRanking(); break;
        case 'profile': renderProfile(); break;
        default: renderLogin();
      }
      // Re-attach event listeners after render
      attachEventListeners();
    }

    // ============ EVENT LISTENERS ============
    function attachEventListeners() {
      // Login
      const loginBtn = document.getElementById('btn-login');
      if (loginBtn) {
        loginBtn.addEventListener('click', handleLogin);
      }
      
      // Navigation
      document.querySelectorAll('[data-view]').forEach(el => {
        el.addEventListener('click', (e) => {
          const view = e.target.dataset.view;
          if (view) navigateTo(view);
        });
      });
      
      // Numpad
      document.querySelectorAll('.numpad-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const value = btn.dataset.value;
          if (value) handleNumpadInput(value);
        });
      });
      
      // Cell clicks
      document.querySelectorAll('.cell.cociente').forEach(cell => {
        cell.addEventListener('click', (e) => {
          const row = parseInt(cell.dataset.row);
          const col = parseInt(cell.dataset.col);
          if (!isNaN(row) && !isNaN(col)) selectCell(row, col);
        });
      });
      
      // Difficulty
      const diffSelect = document.getElementById('difficulty-select');
      if (diffSelect) {
        diffSelect.addEventListener('change', (e) => {
          state.difficulty = e.target.value;
        });
      }
      
      // Game buttons
      const btnNew = document.getElementById('btn-new-problem');
      if (btnNew) btnNew.addEventListener('click', generateNewProblem);
      
      const btnCheck = document.getElementById('btn-check');
      if (btnCheck) btnCheck.addEventListener('click', checkDivision);
      
      const btnClear = document.getElementById('btn-clear');
      if (btnClear) btnClear.addEventListener('click', clearCurrentProblem);
      
      const btnHint = document.getElementById('btn-hint');
      if (btnHint) btnHint.addEventListener('click', showHint);
      
      // Ranking tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          const filter = tab.dataset.filter;
          if (filter) {
            state.rankingFilter = filter;
            loadRanking();
          }
        });
      });
      
      // Close modals
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.add('hidden');
          }
        });
      });
    }

    // ============ NAVIGATION ============
    function navigateTo(view) {
      state.view = view;
      if (view === 'ranking') loadRanking();
      if (view === 'game') state.gameActive = true;
      render();
    }

    // ============ AUTH ============
    async function handleLogin() {
      const username = document.getElementById('username-input')?.value?.trim();
      const password = document.getElementById('password-input')?.value?.trim();
      
      if (!username || !password) {
        showMessage('Por favor ingresa usuario y contraseña', 'error');
        return;
      }
      
      // Simple auth via Supabase profiles table
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();
      
      if (error || !data) {
        showMessage('Usuario o contraseña incorrectos', 'error');
        return;
      }
      
      state.user = data;
      state.view = 'game';
      state.gameActive = true;
      render();
      generateNewProblem();
    }

    function showMessage(msg, type = 'info') {
      const msgArea = document.getElementById('message-area');
      if (msgArea) {
        msgArea.textContent = msg;
        msgArea.className = 'message-area ' + type;
        setTimeout(() => {
          msgArea.textContent = '';
          msgArea.className = 'message-area';
        }, 3000);
      }
    }

    // ============ DIVISION GENERATOR ============
    function generateNewProblem() {
      if (!state.gameActive) return;
      
      let divisor, cocienteCorrecto, dividendo;
      const diff = state.difficulty;
      
      switch(diff) {
        case 'easy':
          divisor = randomInt(2, 9);
          cocienteCorrecto = randomInt(10, 99);
          break;
        case 'medium':
          divisor = randomInt(3, 12);
          cocienteCorrecto = randomInt(50, 500);
          break;
        case 'hard':
          divisor = randomInt(7, 19);
          cocienteCorrecto = randomInt(100, 999);
          break;
        default:
          divisor = randomInt(3, 12);
          cocienteCorrecto = randomInt(50, 500);
      }
      
      dividendo = divisor * cocienteCorrecto + randomInt(0, divisor - 1);
      
      state.division = {
        dividendo,
        divisor,
        cociente: cocienteCorrecto,
        residuo: dividendo - divisor * cocienteCorrecto
      };
      
      state.cociente = String(cocienteCorrecto).split('').map(Number);
      state.currentRow = 0;
      state.currentCol = 0;
      state.selectedCell = null;
      state.currentProblemStartTime = Date.now();
      
      render();
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ============ GAME LOGIC ============
    function selectCell(row, col) {
      if (!state.gameActive) return;
      state.currentRow = row;
      state.currentCol = col;
      state.selectedCell = { row, col };
      render();
    }

    function handleNumpadInput(value) {
      if (!state.gameActive || !state.selectedCell) return;
      
      const { row, col } = state.selectedCell;
      const cellValue = parseInt(value);
      
      if (isNaN(cellValue)) {
        if (value === '⌫') {
          // Backspace
          if (col > 0) {
            state.selectedCell = { row, col: col - 1 };
          }
        } else if (value === 'clear') {
          clearCurrentProblem();
          return;
        }
        render();
        return;
      }
      
      // Verify if correct
      const cocienteStr = String(state.division.cociente);
      const correctDigit = parseInt(cocienteStr[col]);
      
      if (cellValue === correctDigit) {
        state.score += 10;
        state.streak++;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        
        // Move to next cell
        if (col < cocienteStr.length - 1) {
          state.selectedCell = { row, col: col + 1 };
        } else {
          // Finished!
          completeProblem(true);
          return;
        }
        showMessage('¡Correcto! ⚔️', 'success');
      } else {
        state.errors++;
        state.streak = 0;
        showMessage('¡Incorrecto! Intenta de nuevo 🛡️', 'error');
      }
      
      render();
    }

    function checkDivision() {
      if (!state.division) return;
      completeProblem(true);
    }

    function completeProblem(success) {
      if (success) {
        state.correctProblems++;
        state.totalProblems++;
        const time = Date.now() - state.currentProblemStartTime;
        state.problemTimes.push(time);
        
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
        
        showMessage('¡Victoria! 🏆', 'success');
        
        // Save score
        saveScore();
      }
      
      state.gameActive = true;
      setTimeout(() => generateNewProblem(), 1500);
    }

    function clearCurrentProblem() {
      state.selectedCell = null;
      state.currentCol = 0;
      render();
    }

    function showHint() {
      if (!state.division) return;
      const hint = String(state.division.cociente)[state.currentCol];
      showMessage(`Pista: el siguiente dígito es ${hint}`, 'info');
      state.score = Math.max(0, state.score - 5);
      render();
    }

    async function saveScore() {
      if (!state.user) return;
      
      const avgTime = state.problemTimes.length > 0 
        ? state.problemTimes.reduce((a, b) => a + b, 0) / state.problemTimes.length 
        : 0;
      
      await supabase.from('scores').insert({
        user_id: state.user.id,
        username: state.user.username,
        score: state.score,
        streak: state.bestStreak,
        correct: state.correctProblems,
        total: state.totalProblems,
        avg_time: Math.round(avgTime / 1000),
        difficulty: state.difficulty
      });
    }

    // ============ RANKING ============
    async function loadRanking() {
      let query = supabase
        .from('scores')
        .select('*')
        .order('score', { ascending: false })
        .limit(50);
      
      if (state.rankingFilter !== 'all') {
        query = query.eq('difficulty', state.rankingFilter);
      }
      
      const { data, error } = await query;
      
      if (!error && data) {
        renderRankingTable(data);
      }
    }

    function renderRankingTable(scores) {
      const tbody = document.getElementById('ranking-tbody');
      if (!tbody) return;
      
      tbody.innerHTML = scores.map((s, i) => {
        const rank = i + 1;
        let rankClass = 'rank-iron';
        if (rank === 1) rankClass = 'rank-heroic';
        else if (rank <= 3) rankClass = 'rank-diamond';
        else if (rank <= 10) rankClass = 'rank-gold';
        else if (rank <= 25) rankClass = 'rank-silver';
        
        return `
          <tr>
            <td><span class="rank-badge" style="color: var(--${rankClass});">#${rank}</span></td>
            <td>${s.username || 'Anónimo'}</td>
            <td>${s.score}</td>
            <td>${s.correct}/${s.total}</td>
            <td>${s.avg_time || 0}s</td>
            <td>${s.difficulty || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // ============ RENDER FUNCTIONS ============
    function renderLogin() {
      content.innerHTML = `
        <div class="card login-container animate__animated animate__fadeIn">
          <div style="font-size: 3rem; margin-bottom: 10px;">🏰</div>
          <h2 style="font-family: var(--font-cinzel-decorative); color: var(--golden);">Entrar al Arsenal</h2>
          <input type="text" id="username-input" placeholder="Usuario" style="width: 100%; max-width: 280px; padding: 12px; margin: 8px 0; background: #0a0a0a; border: 1px solid var(--border-medieval); color: var(--text-light); font-family: var(--font-display); font-size: 1rem; border-radius: 6px; min-height: 44px; -webkit-appearance: none;" inputmode="text" autocomplete="username">
          <input type="password" id="password-input" placeholder="Contraseña" style="width: 100%; max-width: 280px; padding: 12px; margin: 8px 0; background: #0a0a0a; border: 1px solid var(--border-medieval); color: var(--text-light); font-family: var(--font-display); font-size: 1rem; border-radius: 6px; min-height: 44px; -webkit-appearance: none;" autocomplete="current-password">
          <button class="btn primary" id="btn-login" style="margin-top: 15px; width: 200px;">⚔️ Entrar</button>
          <div id="message-area" class="message-area"></div>
        </div>
      `;
    }

    function renderGame() {
      const { division, selectedCell, score, streak, bestStreak, errors } = state;
      
      let gridHTML = '';
      let numpadHTML = '';
      let divisionInfoHTML = '';
      
      if (division) {
        const cocienteStr = String(division.cociente);
        const numCols = cocienteStr.length;
        
        // Build grid
        gridHTML = '<div class="grid-scroll"><div class="grid-matriz">';
        
        // Row 0: cociente cells
        for (let c = 0; c < 9; c++) {
          const isActive = c < numCols;
          const isSelected = selectedCell && selectedCell.row === 0 && selectedCell.col === c;
          gridHTML += `<div class="cell cociente ${isSelected ? 'selected' : ''} ${!isActive ? 'disabled' : ''}" 
            data-row="0" data-col="${c}">${isActive ? (c < state.currentCol ? cocienteStr[c] : '') : ''}</div>`;
        }
        
        // Rows 1-14: placeholder for manual division steps
        for (let r = 1; r < 15; r++) {
          for (let c = 0; c < 9; c++) {
            gridHTML += `<div class="cell resta" data-row="${r}" data-col="${c}"></div>`;
          }
        }
        
        gridHTML += '</div>';
        
        // Residuo
        gridHTML += `
          <div class="residuo-container" style="margin-top: 8px;">
            <span class="residuo-label">RESIDUO:</span>
            <input type="number" class="residuo-input" id="residuo-input" value="${division.residuo}" readonly inputmode="numeric">
          </div>
        </div>`;
        
        // Division info
        divisionInfoHTML = `
          <div class="division-info">
            <span>${division.dividendo}</span> ÷ <span>${division.divisor}</span> = ?
          </div>`;
        
        // Numpad
        numpadHTML = `
          <div class="numpad">
            ${[1,2,3,4,5,6,7,8,9,'⌫',0].map(v => 
              `<button class="numpad-btn" data-value="${v}">${v}</button>`
            ).join('')}
            <button class="numpad-btn action" data-value="clear">CLR</button>
          </div>`;
      }
      
      content.innerHTML = `
        <div class="animate__animated animate__fadeIn">
          <!-- Stats Bar -->
          <div class="card stats-bar">
            <div class="stat-item">
              <span class="stat-icon">⚔️</span>
              <span class="stat-value" id="stat-score">${score}</span>
              <span class="stat-label">Puntos</span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">🔥</span>
              <span class="stat-value">${streak}</span>
              <span class="stat-label">Racha</span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">👑</span>
              <span class="stat-value">${bestStreak}</span>
              <span class="stat-label">Mejor</span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">💀</span>
              <span class="stat-value">${errors}</span>
              <span class="stat-label">Errores</span>
            </div>
          </div>
          
          <!-- Division Area -->
          <div class="card division-area">
            ${divisionInfoHTML}
            <div class="grid-container">
              ${gridHTML}
            </div>
            <div id="message-area" class="message-area"></div>
            ${numpadHTML}
          </div>
          
          <!-- Controls -->
          <div class="btn-group" style="margin-top: 10px;">
            <select id="difficulty-select" class="btn" style="min-height: 44px; -webkit-appearance: none;">
              <option value="easy">Fácil</option>
              <option value="medium" selected>Medio</option>
              <option value="hard">Difícil</option>
            </select>
            <button class="btn" id="btn-new-problem">🔄 Nueva</button>
            <button class="btn primary" id="btn-check">✓ Verificar</button>
            <button class="btn danger" id="btn-clear">✕ Limpiar</button>
            <button class="btn" id="btn-hint">💡 Pista</button>
          </div>
          
          <!-- Navigation -->
          <div class="btn-group" style="margin-top: 5px;">
            <button class="btn" data-view="ranking">🏆 Ranking</button>
            <button class="btn" data-view="profile">👤 Perfil</button>
          </div>
        </div>
      `;
    }

    function renderRanking() {
      content.innerHTML = `
        <div class="card animate__animated animate__fadeIn">
          <h2 style="font-family: var(--font-cinzel-decorative); color: var(--golden); text-align: center; margin-bottom: 15px;">🏆 Salón de la Fama</h2>
          
          <div class="tabs">
            <button class="tab ${state.rankingFilter === 'all' ? 'active' : ''}" data-filter="all">Todos</button>
            <button class="tab ${state.rankingFilter === 'easy' ? 'active' : ''}" data-filter="easy">Fácil</button>
            <button class="tab ${state.rankingFilter === 'medium' ? 'active' : ''}" data-filter="medium">Medio</button>
            <button class="tab ${state.rankingFilter === 'hard' ? 'active' : ''}" data-filter="hard">Difícil</button>
          </div>
          
          <div style="overflow-x: auto; margin-top: 10px;">
            <table class="ranking-table">
              <thead>
                <tr>
                  <th>Rango</th>
                  <th>Guerrero</th>
                  <th>Puntos</th>
                  <th>Aciertos</th>
                  <th>Tiempo</th>
                  <th>Modo</th>
                </tr>
              </thead>
              <tbody id="ranking-tbody">
                <tr><td colspan="6" style="padding: 20px;">Cargando...</td></tr>
              </tbody>
            </table>
          </div>
          
          <div class="btn-group" style="margin-top: 15px;">
            <button class="btn" data-view="game">⚔️ Volver al Juego</button>
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const { user, score, bestStreak, correctProblems, totalProblems, errors } = state;
      
      content.innerHTML = `
        <div class="card animate__animated animate__fadeIn" style="text-align: center;">
          <div style="font-size: 4rem;">🛡️</div>
          <h2 style="font-family: var(--font-cinzel-decorative); color: var(--golden);">${user?.username || 'Guerrero'}</h2>
          
          <div class="stats-bar" style="margin: 20px 0;">
            <div class="stat-item">
              <span class="stat-value">${score}</span>
              <span class="stat-label">Puntos</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">${bestStreak}</span>
              <span class="stat-label">Mejor Racha</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">${correctProblems}/${totalProblems}</span>
              <span class="stat-label">Aciertos</span>
            </div>
          </div>
          
          <div class="btn-group" style="margin-top: 15px;">
            <button class="btn" data-view="game">⚔️ Jugar</button>
            <button class="btn" data-view="ranking">🏆 Ranking</button>
            <button class="btn danger" data-view="login">🚪 Salir</button>
          </div>
        </div>
      `;
    }

    // ============ INIT ============
    render();
    
    // Check for existing session
    async function checkSession() {
      const savedUser = localStorage.getItem('divisionProfeUser');
      if (savedUser) {
        try {
          state.user = JSON.parse(savedUser);
          state.view = 'game';
          state.gameActive = true;
          render();
          generateNewProblem();
        } catch(e) {
          localStorage.removeItem('divisionProfeUser');
        }
      }
    }
    
    // Override login to save session
    const originalLogin = handleLogin;
    handleLogin = async function() {
      await originalLogin();
      if (state.user) {
        localStorage.setItem('divisionProfeUser', JSON.stringify(state.user));
      }
    };
    
    checkSession();
    
    console.log('🏰 Arsenal Medieval V25 - ¡Listo para la batalla! ⚔️');
  </script>
</body>
</html>
